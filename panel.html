<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIMISH PANEL</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 10px;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            padding: 10px;
            border-bottom: 2px solid #00ffcc;
            margin-bottom: 10px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            text-shadow: 0 0 10px #00ffcc;
        }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 0 5px rgba(0, 255, 204, 0.2);
        }
        .card h3 {
            margin-top: 0;
            color: #fff;
        }
        button {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 5px;
        }
        button:active {
            background: #00cccc;
        }
        .status {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 5px;
        }
        /* Floating Window Styles */
        #floating-window {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ffcc;
            border-radius: 50%;
            display: none; /* Hidden by default */
            z-index: 9999;
            cursor: move;
            touch-action: none;
        }
        #floating-window-header {
            height: 30px;
            background: #00ffcc;
            color: #000;
            text-align: center;
            line-height: 30px;
            font-weight: bold;
            border-radius: 50% 50% 0 0;
        }
        #floating-window-content {
            padding: 10px;
            color: #fff;
            font-size: 10px;
            text-align: center;
        }
        .toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #00ffcc;
        }
        input:checked + .slider:before {
            transform: translateX(24px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>NIMISH PANEL</h1>
            <div class="status">Status: Active | User: Nimish</div>
        </div>

        <div class="content">
            <!-- Floating Window Control -->
            <div class="card">
                <h3>🔮 Floating Window</h3>
                <div class="toggle-container">
                    <span>Show Floating Icon</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="floatToggle">
                        <span class="slider"></span>
                    </label>
                </div>
                <p style="font-size: 12px; color: #aaa;">Enable to see a floating icon over other apps.</p>
            </div>

            <!-- Features Section -->
            <div class="card">
                <h3>⚡ Features</h3>
                <button onclick="alert('Aimbot Activated!')">Activate Aimbot</button>
                <button onclick="alert('ESP Enabled!')">Enable ESP</button>
                <button onclick="alert('Speed Hack On!')">Speed Hack</button>
            </div>

            <div class="card">
                <h3>💎 Diamond Farm</h3>
                <button onclick="startFarming()">Start Auto-Farm</button>
                <div id="farmStatus" class="status">Idle</div>
            </div>
            
            <div class="card">
                <h3>🛠️ Settings</h3>
                <button onclick="resetSettings()">Reset Panel</button>
            </div>
        </div>
    </div>

    <!-- The Actual Floating Window Element -->
    <div id="floating-window">
        <div id="floating-window-header">NIMISH</div>
        <div id="floating-window-content">
            Tap to Open<br>
            <small>v6.2</small>
        </div>
    </div>

    <script>
        // Floating Window Logic
        const floatWindow = document.getElementById('floating-window');
        const floatToggle = document.getElementById('floatToggle');
        let isDragging = false;
        let offsetX, offsetY;

        floatToggle.addEventListener('change', function() {
            if(this.checked) {
                floatWindow.style.display = 'block';
                // Try to request overlay permission if needed (Android 23+)
                // Note: In a pure HTML/JS wrapper, this often requires a custom Android Activity 
                // to handle SYSTEM_ALERT_WINDOW properly. 
                // For now, this just shows it within the WebView or as a DOM element.
                alert("Floating Window Enabled!");
            } else {
                floatWindow.style.display = 'none';
            }
        });

        // Dragging Logic for the Floating Window
        const header = document.getElementById('floating-window-header');
        
        header.addEventListener('mousedown', startDrag);
        header.addEventListener('touchstart', startDrag, {passive: false});

        function startDrag(e) {
            e.preventDefault();
            isDragging = true;
            const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
            
            offsetX = clientX - floatWindow.offsetLeft;
            offsetY = clientY - floatWindow.offsetTop;

            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchmove', drag, {passive: false});
            document.addEventListener('touchend', stopDrag);
        }

        function drag(e) {
            if (!isDragging) return;
            const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
            
            floatWindow.style.left = (clientX - offsetX) + 'px';
            floatWindow.style.top = (clientY - offsetY) + 'px';
            floatWindow.style.right = 'auto'; // Clear right positioning when dragging
            floatWindow.style.bottom = 'auto';
        }

        function stopDrag() {
            isDragging = false;
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('mouseup', stopDrag);
            document.removeEventListener('touchmove', drag);
            document.removeEventListener('touchend', stopDrag);
        }

        // Feature Functions
        function startFarming() {
            const status = document.getElementById('farmStatus');
            status.textContent = "Farming...";
            status.style.color = "#00ffcc";
            setTimeout(() => {
                status.textContent = "Farm Complete! Diamonds Added.";
                setTimeout(() => {
                    status.textContent = "Idle";
                    status.style.color = "#666";
                }, 3000);
            }, 2000);
        }

        function resetSettings() {
            if(confirm("Reset all settings?")) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
