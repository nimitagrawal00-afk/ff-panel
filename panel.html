<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FF MAX MASTER HUB</title>
    <style>
        /* CORE STYLES */
        body {
            margin: 0;
            padding: 0;
            background-color: rgba(10, 10, 15, 0.9);
            font-family: 'Courier New', monospace;
            color: #00ffcc;
            overflow: hidden;
            touch-action: none;
        }

        /* FLOATING WINDOW CONTAINER */
        #overlay-container {
            position: fixed;
            top: 50px;
            left: 20px;
            width: 320px;
            max-height: 90vh;
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 2px solid #00ffcc;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4), inset 0 0 10px rgba(0, 0, 0, 0.8);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(5px);
        }

        /* HEADER & DRAG HANDLE */
        .header {
            background: #0f3460;
            padding: 10px;
            border-bottom: 1px solid #00ffcc;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h2 {
            margin: 0;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #00ffcc;
        }

        .close-btn {
            background: #e94560;
            border: none;
            color: white;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            line-height: 25px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
        }

        /* SCROLLABLE CONTENT AREA */
        .content {
            padding: 15px;
            overflow-y: auto;
            flex-grow: 1;
        }

        /* SECTION TITLES */
        .section-title {
            color: #fff;
            font-size: 12px;
            margin-top: 15px;
            margin-bottom: 8px;
            border-left: 3px solid #e94560;
            padding-left: 8px;
            text-transform: uppercase;
        }

        /* TOGGLE SWITCHES */
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .label {
            font-size: 13px;
            font-weight: bold;
            color: #ddd;
        }

        input[type="range"] {
            width: 100%;
            margin-top: 5px;
            accent-color: #00ffcc;
        }

        /* CUSTOM TOGGLE SWITCH */
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #00ffcc; }
        input:checked + .slider:before { transform: translateX(20px); }

        /* BUTTONS */
        .action-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #0f3460, #16213e);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        .action-btn:active {
            background: #00ffcc;
            color: #000;
            transform: scale(0.98);
        }

        /* STATUS INDICATOR */
        .status-bar {
            padding: 5px 15px;
            background: #000;
            font-size: 10px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #333;
        }
        .dot {
            height: 8px;
            width: 8px;
            background-color: #e94560;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.active { background-color: #00ffcc; box-shadow: 0 0 5px #00ffcc; }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 5px; }
    </style>
</head>
<body>

<div id="overlay-container">
    <!-- Header -->
    <div class="header" id="drag-handle">
        <h2>⚡ FF MASTER v9.0</h2>
        <button class="close-btn" onclick="togglePanel()">✕</button>
    </div>

    <!-- Content -->
    <div class="content">
        
        <!-- VISUAL HACKS -->
        <div class="section-title">Visual Overrides</div>
        
        <div class="control-row">
            <span class="label">ESP Player Box</span>
            <label class="switch"><input type="checkbox" checked onchange="log('ESP Box')"><span class="slider"></span></label>
        </div>
        <div class="control-row">
            <span class="label">Skeleton Lines</span>
            <label class="switch"><input type="checkbox" checked onchange="log('Skeleton')"><span class="slider"></span></label>
        </div>
        <div class="control-row">
            <span class="label">Wall Hack (Full)</span>
            <label class="switch"><input type="checkbox" onchange="log('Wallhack')"><span class="slider"></span></label>
        </div>
        <div class="control-row">
            <span class="label">Show HP Bar</span>
            <label class="switch"><input type="checkbox" checked onchange="log('HP Bar')"><span class="slider"></span></label>
        </div>

        <!-- COMBAT -->
        <div class="section-title">Combat Engine</div>

        <div class="control-row">
            <span class="label">Auto Headshot</span>
            <label class="switch"><input type="checkbox" checked onchange="log('Headshot')"><span class="slider"></span></label>
        </div>
        <div class="control-row">
            <span class="label">Aim Assist (Fly)</span>
            <label class="switch"><input type="checkbox" onchange="log('Aim Assist')"><span class="slider"></span></label>
        </div>
        <div class="control-row">
            <span class="label">Auto Kill (Rage)</span>
            <label class="switch"><input type="checkbox" onchange="log('Rage Mode')"><span class="slider"></span></label>
        </div>
        
        <div style="margin-top:10px;">
            <span class="label">Fov / Sensitivity</span>
            <input type="range" min="0" max="100" value="85" oninput="updateRange(this)">
        </div>

        <!-- FARMING -->
        <div class="section-title">Resource Farm</div>

        <div class="control-row">
            <span class="label">Diamond Farm</span>
            <label class="switch"><input type="checkbox" onchange="log('Diamond Farm')"><span class="slider"></span></label>
        </div>
        <div class="control-row">
            <span class="label">Auto Loot</span>
            <label class="switch"><input type="checkbox" checked onchange="log('Auto Loot')"><span class="slider"></span></label>
        </div>
        <div class="control-row">
            <span class="label">Speed Hack</span>
            <label class="switch"><input type="checkbox" onchange="log('Speed')"><span class="slider"></span></label>
        </div>

        <!-- CONFIG -->
        <div class="section-title">Configuration</div>
        <button class="action-btn" onclick="applyConfig()">Inject Config</button>
        <button class="action-btn" style="border-color:#e94560; color:#e94560;" onclick="resetAll()">Reset All</button>

    </div>

    <!-- Footer Status -->
    <div class="status-bar">
        <span>Status: <span id="status-text" style="color:#00ffcc">ACTIVE</span></span>
        <span>Ping: <span id="ping-val">24ms</span></span>
        <span class="dot active"></span>
    </div>
</div>

<script>
    // DRAG FUNCTIONALITY
    const container = document.getElementById("overlay-container");
    const header = document.getElementById("drag-handle");
    let isDragging = false;
    let offsetX, offsetY;

    header.addEventListener("mousedown", startDrag);
    header.addEventListener("touchstart", startDrag, {passive: false});

    function startDrag(e) {
        isDragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        offsetX = container.offsetLeft - clientX;
        offsetY = container.offsetTop - clientY;
        
        document.addEventListener("mousemove", drag);
        document.addEventListener("touchmove", drag, {passive: false});
        document.addEventListener("mouseup", stopDrag);
        document.addEventListener("touchend", stopDrag);
    }

    function drag(e) {
        if (!isDragging) return;
        e.preventDefault();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        container.style.left = (clientX + offsetX) + "px";
        container.style.top = (clientY + offsetY) + "px";
    }

    function stopDrag() {
        isDragging = false;
        document.removeEventListener("mousemove", drag);
        document.removeEventListener("touchmove", drag);
        document.removeEventListener("mouseup", stopDrag);
        document.removeEventListener("touchend", stopDrag);
    }

    // UI FUNCTIONS
    function togglePanel() {
        const content = document.querySelector('.content');
        const status = document.querySelector('.status-bar');
        if (content.style.display === 'none') {
            content.style.display = 'block';
            status.style.display = 'flex';
        } else {
            content.style.display = 'none';
            status.style.display = 'none';
        }
    }

    function log(action) {
        console.log(`[INJECTED] ${action}`);
        // Visual feedback
        const btn = event.target.closest('.control-row') ? event.target.closest('.control-row').querySelector('.label') : null;
        if(btn) {
            const originalColor = btn.style.color;
            btn.style.color = "#00ffcc";
            setTimeout(() => btn.style.color = originalColor, 200);
        }
    }

    function updateRange(el) {
        // Simulate FOV change
        console.log(`FOV Updated: ${el.value}`);
    }

    function applyConfig() {
        const btn = document.querySelector('.action-btn');
        btn.innerText = "APPLYING...";
        btn.style.background = "#00ffcc";
        btn.style.color = "#000";
        
        setTimeout(() => {
            btn.innerText = "CONFIG LOADED ✓";
            setTimeout(() => {
                btn.innerText = "Inject Config";
                btn.style.background = "";
                btn.style.color = "";
            }, 1500);
        }, 800);
    }

    function resetAll() {
        const inputs = document.querySelectorAll('input[type="checkbox"]');
        inputs.forEach(input => input.checked = false);
        alert("System Reset Complete.");
    }

    // Fake Ping Generator
    setInterval(() => {
        const ping = Math.floor(Math.random() * 40) + 15;
        document.getElementById('ping-val').innerText = ping + "ms";
    }, 2000);

</script>

</body>
</html>
